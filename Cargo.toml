[package]
name = "autorumble"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "A small rumble server for Robocode: stores battles, scores robots and serves the rankings."

[dependencies]
axum = "0.8"
fastrand = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
