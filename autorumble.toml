# The AutoRumble server configuration. Relative paths are relative to where the server is started.

# Where to listen. Put nginx in front of this for TLS and rate limits, see deploy/.
listen = "127.0.0.1:8652"

# The SQLite file holding every battle. Back this file up.
database = "data/autorumble.db"

# The directory of author logos, see README.md.
logos = "logos"

# How often to recompute the standings of a rumble with new battles.
standings_seconds = 10

# How often to read the participant lists and logos again.
participants_seconds = 300

# Battles older than this are rejected.
max_battle_age_hours = 24

# The Robocode versions allowed to upload. The client must support HIDENAMES.
allowed_clients = ["1.11.2", "1.11.3"]

# One [[rumble]] per competition. The name must match the client's configuration file, so
# client/autorumble.txt uploads to the rumble named autorumble.
#
#   title        The name shown on the pages.
#   field        The battlefield as WIDTHxHEIGHT.
#   rounds       Rounds per battle.
#   melee_bots   Robots per battle in a melee rumble. Leave it out for 1v1.
#   hide_names   Robots only see their enemies as #0, #1 and so on.
#   participants Where the list comes from. Only { file = "path" } exists so far, see
#                src/participants.rs for adding a web page as a source.

[[rumble]]
name = "autorumble"
title = "AutoRumble"
field = "800x600"
rounds = 35
hide_names = true
participants = { file = "participants/autorumble.txt" }

[[rumble]]
name = "automelee6"
title = "AutoRumble Melee6"
field = "800x800"
rounds = 35
melee_bots = 6
hide_names = true
participants = { file = "participants/automelee6.txt" }

[[rumble]]
name = "openrumble"
title = "OpenRumble"
field = "800x600"
rounds = 35
hide_names = true
participants = { file = "participants/openrumble.txt" }

[[rumble]]
name = "openmelee6"
title = "OpenRumble Melee6"
field = "800x800"
rounds = 35
melee_bots = 6
hide_names = true
participants = { file = "participants/openmelee6.txt" }
