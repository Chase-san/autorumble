# The server's own settings. Each rumble has its own file in rumbles/, see README.md in this folder.
# Relative paths are relative to where the server is started.

# Where to listen. 0.0.0.0 makes it reachable from other machines on the network. When it is public,
# use 127.0.0.1 and put nginx in front of it for TLS and rate limits, see deploy/.
listen = "0.0.0.0:8652"

# The SQLite file holding every battle. Back this file up.
database = "data/autorumble.db"

# The directory of flag and logo images. logos.csv in this folder says which package uses which.
logos = "logos"

# A directory of robot jars to serve at /robots/, for robots that are not hosted anywhere else. Leave it
# out to serve none. A participant list can then point at http://this-server:8652/robots/name_1.0.jar.
robots = "robots"

# How often to recompute the standings of a rumble with new battles.
standings_seconds = 10

# How often to read the participant lists and logos again.
participants_seconds = 300

# Battles older than this are rejected.
max_battle_age_hours = 24

# The Robocode versions allowed to upload. The client must also support HIDENAMES and CLEARDATA for a
# rumble that needs them, which the server checks on each result.
allowed_clients = ["1.11.2", "1.11.3"]
