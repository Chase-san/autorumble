# TLS, compression and rate limits in front of the server. Replace rumble.example.com, and get the
# certificate first, for example with certbot.

# Limit pages per address, but not uploads: clients are slowed down by the server's own replies.
map $request_uri $autorumble_limit_key {
    default              $binary_remote_addr;
    ~^/UploadedResults   "";
}
limit_req_zone $autorumble_limit_key zone=autorumble:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name rumble.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rumble.example.com;

    ssl_certificate     /etc/letsencrypt/live/rumble.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rumble.example.com/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/json;

    client_max_body_size 2m;

    location / {
        limit_req zone=autorumble burst=20 nodelay;
        proxy_pass http://127.0.0.1:8652;
        proxy_set_header Host $host;
    }
}
